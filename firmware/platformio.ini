[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@7.1.0
board = esp32dev
framework = arduino
lib_deps =
    h2zero/NimBLE-Arduino@1.4.1
    bblanchon/ArduinoJson@7.4.3
monitor_speed = 115200
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = partitions_4mb.csv

; Bench test build only: no app/Firebase; devices chosen over UART serial.
[env:bench-esp32]
extends = env:esp32dev
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DNOXBRAIN_BENCH
